# Lokale Umgebung (Plan 6.5). Start: docker compose up --build
# Aufrufe: Anwendung http://localhost:8080 · Büro http://localhost:8080/buero · Mails http://localhost:8025
name: emprise

x-backend-env: &backend-env
  EMPRISE_ENV: local
  EMPRISE_LOG_LEVEL: INFO
  EMPRISE_DATABASE_URL: postgresql+psycopg://app:app@db:5432/emprise
  EMPRISE_MIGRATION_DATABASE_URL: postgresql+psycopg://migrator:migrator@db:5432/emprise
  EMPRISE_PUBLIC_BASE_URL: ${EMPRISE_PUBLIC_BASE_URL:-http://localhost:8080}
  # Lokaler OIDC-Testdienst. oidc.localhost zeigt im Browser auf 127.0.0.1 und im Compose-Netz auf den Dienst.
  EMPRISE_OIDC_ISSUER: http://oidc.localhost:8081/emprise
  EMPRISE_OIDC_CLIENT_ID: emprise-local
  EMPRISE_OIDC_CLIENT_SECRET: local-secret
  EMPRISE_S3_ENDPOINT_URL: http://storage:8333
  EMPRISE_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  EMPRISE_S3_ACCESS_KEY: emprise
  EMPRISE_S3_SECRET_KEY: emprise-local-secret
  EMPRISE_S3_BUCKET: emprise-local
  EMPRISE_SMTP_HOST: mailpit
  EMPRISE_SMTP_PORT: "1025"
  # Regelauswertung (G2) über OpenRouter: Schlüssel aus der Shell oder einer .env neben compose.yaml; ohne Schlüssel keine Auswertung
  EMPRISE_OPENROUTER_API_KEY: ${EMPRISE_OPENROUTER_API_KEY:-}
  EMPRISE_RULES_BUDGET_MONTH_USD: ${EMPRISE_RULES_BUDGET_MONTH_USD:-20}
  # Modell (Name wie auf openrouter.ai/models) und seine Preise je Million Token für Kostenzählung und Budget
  EMPRISE_RULES_MODEL: ${EMPRISE_RULES_MODEL:-anthropic/claude-opus-5}
  EMPRISE_RULES_PRICE_INPUT_PER_MTOK: ${EMPRISE_RULES_PRICE_INPUT_PER_MTOK:-5}
  EMPRISE_RULES_PRICE_OUTPUT_PER_MTOK: ${EMPRISE_RULES_PRICE_OUTPUT_PER_MTOK:-25}
  EMPRISE_RULES_INPUT: ${EMPRISE_RULES_INPUT:-pdf}
  FORWARDED_ALLOW_IPS: "*"

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/20-emprise.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emprise"]
      interval: 3s
      timeout: 3s
      retries: 30

  storage:
    # S3-kompatibel wie auf Unraid (ANNAHMEN A16, A22). MinIO ist auf quay.io seit dem 25.09.2026
    # nicht mehr anonym abrufbar; SeaweedFS spricht denselben S3-Anschluss, hört auf 8333 und ist
    # auf dem Rechner unter Port 9000 erreichbar. Keine Konsole: Dateien über die API oder die CLI.
    # `-volume.max=0`: Volume-Plätze nach freiem Platz statt fest 8 – jeder Bucket belegt bis zu 7,
    # mit dem Bucket des Analyse-Stacks waren sie aufgebraucht („failing to assign a file id“).
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"emprise","credentials":[{"accessKey":"emprise",
        "secretKey":"emprise-local-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        | tr -d ' \n' > /tmp/s3.json &&
        exec weed server -dir=/data -volume.max=0 -s3 -s3.config=/tmp/s3.json
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:9000:8333"
    healthcheck:
      # Master, Volume, Filer und S3 starten nacheinander; der S3-Anschluss ist zuletzt da (~15 s)
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    environment:
      SERVER_PORT: "8081"
      JSON_CONFIG_PATH: /config/oidc.json
    volumes:
      - ./infra/local/oidc.json:/config/oidc.json:ro
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      default:
        aliases:
          - oidc.localhost

  migrate:
    build:
      context: backend
      target: runtime
    image: emprise-backend:local
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli storage-init"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: on-failure:5

  api:
    image: emprise-backend:local
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: emprise-backend:local
    command: ["python", "-m", "app.cli", "worker"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: frontend
    image: emprise-web:local
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # Tests und Werkzeuge mit Dev-Abhängigkeiten: docker compose run --rm backend-dev pytest
  backend-dev:
    profiles: ["dev"]
    build:
      context: backend
      target: dev
    image: emprise-backend:dev
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
      EMPRISE_ENV: test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
