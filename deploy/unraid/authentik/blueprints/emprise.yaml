# Richtet Authentik für Emprise ein; Authentik wendet den Blueprint beim Start und bei Änderungen an.
# - Zweiter Faktor wird Pflicht: Wer noch keinen hat, richtet ihn bei der nächsten Anmeldung ein.
# - OAuth2/OIDC-Anbieter und Anwendung "emprise" mit fester Rücksprungadresse.
# - E-Mail gilt als bestätigt, weil Konten nur von Administratoren angelegt werden (keine Selbstregistrierung).
version: 1
metadata:
  name: Emprise – Anmeldung Büro
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    state: present
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes: [totp, webauthn, static]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  - model: authentik_providers_oauth2.scopemapping
    id: emprise-email-scope
    state: present
    identifiers:
      name: "Emprise: email (bestätigt)"
    attrs:
      scope_name: email
      description: E-Mail-Adresse
      expression: |
        return {"email": request.user.email, "email_verified": bool(request.user.email)}

  - model: authentik_providers_oauth2.oauth2provider
    id: emprise-provider
    state: present
    identifiers:
      name: Emprise
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Seit Authentik 2026 ausdrücklich nötig; Emprise nutzt keine Refresh-Token
      grant_types: [authorization_code]
      client_id: emprise
      client_secret: !Env EMPRISE_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/v1/auth/staff/callback", !Env EMPRISE_PUBLIC_BASE_URL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf emprise-email-scope
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=10

  - model: authentik_core.application
    state: present
    identifiers:
      slug: emprise
    attrs:
      name: Emprise
      provider: !KeyOf emprise-provider
      meta_launch_url: !Format ["%s/buero", !Env EMPRISE_PUBLIC_BASE_URL]
      policy_engine_mode: any
