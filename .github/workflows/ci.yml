# Prüfungen je Pull Request und auf main (Plan 6.5 Schritt 1–2).
# Ausgeliefert wird bis zur Beta per deploy/unraid/deploy.sh (D3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Texterkennung für gescannte PDFs (AN7)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-fra
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Dateiverzeichnis anlegen (die Tests nutzen ein eigenes, conftest.py)
        run: EMPRISE_ENV=test EMPRISE_FILES_DIR=/tmp/emprise-files uv run python -m app.cli storage-init
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm-Version aus packageManager der Wurzel-package.json; Lockfile des Workspace im Wurzelordner
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter emprise-frontend...
      - name: API-Typen aktuell
        run: pnpm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # Rechenkern und Rechendienst des Hausmodells (docs/PLAN_HAUSMODELL.md 3.2, 3.3)
  domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # pnpm-Version aus packageManager der Wurzel-package.json; Lockfile des Workspace im Wurzelordner
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @emprise/engine...
      # openapi.json selbst prüft der Backend-Job (test_openapi_contract.py)
      - name: Vertragstypen aktuell
        working-directory: packages/domain
        run: pnpm run contract:types && git diff --exit-code -- src/contract.gen.ts
      - name: Rechenkern
        working-directory: packages/domain
        run: pnpm run lint && pnpm run typecheck && pnpm run test
      - name: Szenarien (P 19.7)
        working-directory: packages/domain
        run: pnpm run scenarios
      - name: Rechendienst
        working-directory: engine
        run: pnpm run lint && pnpm run typecheck && pnpm run test && pnpm run build
      - name: Bündel startet
        working-directory: engine
        run: |
          PORT=8090 node dist/server.mjs &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8090/health && exit 0; sleep 0.5; done
          exit 1

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, domain]
    # compose.e2e.yaml kappt den Zugang zu fremden Diensten (A28); gilt für alle Schritte des Jobs
    env:
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Umgebung starten
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health/ready && exit 0; sleep 2; done
          docker compose logs --no-color --tail 100; exit 1
      - name: Testkonto freischalten
        run: docker compose exec -T api python -m app.cli staff-add ops@emprise.local ops
      - name: Kataster-Ausschnitt importieren (G1)
        run: |
          docker compose cp backend/tests/fixtures/site api:/tmp/site-fixtures
          docker compose exec -T api python -m app.cli cadastre-import --from-dir /tmp/site-fixtures --release e2e --force
      - name: Planstand und aufgezeichnete Auswertung einspielen (G2, ohne OpenRouter)
        run: |
          docker compose cp backend/tests api:/tmp/tests
          docker compose exec -T -e EMPRISE_OPENROUTER_API_KEY=e2e-ohne-aufruf -e PYTHONPATH=/tmp api python -m tests.e2e_seed_rules
      - name: Demohaus einspielen (HM4, ohne IFC)
        # nutzt /tmp/tests aus dem Schritt davor
        run: |
          docker compose cp packages/domain/seed/demo-house api:/tmp/demo-house
          docker compose exec -T -e PYTHONPATH=/tmp api python -m tests.e2e_seed_house /tmp/demo-house
      # pnpm-Version aus packageManager der Wurzel-package.json; Lockfile des Workspace im Wurzelordner
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --filter emprise-frontend...
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
        env:
          CI: "1"
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geheimnis-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Images bauen
        run: |
          docker build -t emprise-backend:ci --target runtime backend
          docker build -f frontend/Dockerfile -t emprise-web:ci .
          docker build -f engine/Dockerfile -t emprise-engine:ci .
      - name: Image-Scan Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emprise-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image-Scan Web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emprise-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image-Scan Rechendienst
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emprise-engine:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
