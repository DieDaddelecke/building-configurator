# Prüfungen je Pull Request und auf main (Plan 6.5 Schritt 1–2).
# Auslieferung nach Staging/Produktion folgt nach der Anbieterwahl (D3) in deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      TEST_S3: "1"
      EMPRISE_S3_ENDPOINT_URL: http://localhost:9000
      EMPRISE_S3_ACCESS_KEY: emprise
      EMPRISE_S3_SECRET_KEY: emprise-ci-secret
      EMPRISE_S3_BUCKET: emprise-ci
    steps:
      - uses: actions/checkout@v4
      - name: MinIO starten
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=emprise -e MINIO_ROOT_PASSWORD=emprise-ci-secret \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Bucket anlegen
        run: |
          for i in $(seq 1 20); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          EMPRISE_ENV=test uv run python -m app.cli storage-init
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Version aus packageManager; package.json liegt nicht im Wurzelordner
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API-Typen aktuell
        run: pnpm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Umgebung starten
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health/ready && exit 0; sleep 2; done
          docker compose logs --no-color --tail 100; exit 1
      - name: Testkonto freischalten
        run: docker compose exec -T api python -m app.cli staff-add ops@emprise.local ops
      - name: Kataster-Ausschnitt importieren (G1)
        run: |
          docker compose cp backend/tests/fixtures/site api:/tmp/site-fixtures
          docker compose exec -T api python -m app.cli cadastre-import --from-dir /tmp/site-fixtures --release e2e --force
      - uses: pnpm/action-setup@v4
        with:
          # Version aus packageManager; package.json liegt nicht im Wurzelordner
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
        env:
          CI: "1"
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geheimnis-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Images bauen
        run: |
          docker build -t emprise-backend:ci --target runtime backend
          docker build -t emprise-web:ci frontend
      - name: Image-Scan Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emprise-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image-Scan Web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emprise-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
